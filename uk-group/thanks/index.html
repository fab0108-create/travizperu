<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Interest registered | TravizPeru</title>
<link rel="canonical" href="https://travizperu.com/uk-group/thanks/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF8F3;--ink:#1A1A1A;--mid:#6B6B6B;--border:#E2DDD6;--gold:#8B6914;--serif:'Libre Baskerville',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.logo{font-family:var(--serif);font-size:1.25rem;text-decoration:none}
.logo em{font-style:italic;color:var(--gold)}
main{flex:1;max-width:640px;margin:0 auto;padding:3.5rem 1.25rem}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.2;margin-bottom:.8rem}
p{color:#2D2D2D;margin-bottom:1rem}
.wa{display:inline-block;margin-top:.6rem;background:#25D366;color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;padding:.8rem 1.1rem;border-radius:2px}
.back{display:inline-block;margin-top:1.2rem;color:var(--gold);font-weight:600;font-size:.9rem}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="/">Traviz<em>Peru</em></a>
</header>
<main>
  <p class="eyebrow">UK group</p>
  <h1>Thank you. Your interest is registered.</h1>
  <p>We have your note. The departures and the price stay indicative until a place is confirmed. We will write to you by email.</p>
  <p>If you would rather talk now, WhatsApp is open.</p>
  <a class="wa" href="https://wa.me/51982521128?text=Hello%2C%20I%20have%20just%20registered%20interest%20in%20the%20UK%20small-group%20journey%20to%20Peru.">WhatsApp +51 982 521 128</a>
  <a class="back" href="/uk-group/">Back to the journey</a>
</main>
</body>
</html>
